<svg xmlns="http://www.w3.org/2000/svg" width="830" height="211" viewBox="0 0 830 211" role="img" aria-labelledby="t d"><title id="t">QRIntegrity</title><desc id="d">QRIntegrity: The idea of this project is to design a anti-counterfeit system using blockchain that secure the product details using QR code and provide security to the customers by giving them their data.</desc><style>@font-face{font-family:"Fira Code";font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"Fira Code";font-weight:700;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}
svg{--paper:#ece7e1;--ink:#11111b;--muted:#5f5a66;--line:#d3ccc2;--brand:#8000ff;--cell:#11111b14}
@media (prefers-color-scheme:dark){svg{--paper:#11111b;--ink:#ece7e1;--muted:#9c9aab;--line:#27273a;--brand:#a566ff;--cell:#ece7e112}}
.card{fill:var(--paper);stroke:var(--line)}
text{fill:var(--ink);font-family:'Fira Code',ui-monospace,Menlo,Consolas,monospace}
.m{fill:var(--muted)} .br{fill:var(--brand)}
.st{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

