<svg xmlns="http://www.w3.org/2000/svg" width="830" height="310" viewBox="0 0 830 310" role="img" aria-labelledby="t d"><title id="t">Contributions per month</title><desc id="d">23 contributions in the last 12 months; current streak 1 day, 9 active days, busiest day 6 on Mon 2 Nov 2026.</desc><style>@font-face{font-family:"Fira Code";font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"Fira Code";font-weight:700;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}
svg{--paper:#ece7e1;--ink:#11111b;--muted:#5f5a66;--line:#d3ccc2;--brand:#8000ff;--cell:#11111b14}
@media (prefers-color-scheme:dark){svg{--paper:#11111b;--ink:#ece7e1;--muted:#9c9aab;--line:#27273a;--brand:#a566ff;--cell:#ece7e112}}
.card{fill:var(--paper);stroke:var(--line)}
text{fill:var(--ink);font-family:'Fira Code',ui-monospace,Menlo,Consolas,monospace}
.m{fill:var(--muted)} .br{fill:var(--brand)}
.st{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes pop{from{opacity:0;transform:scale(.2)}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes fade{from{opacity:0}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade .8s ease-out both}
.grow{animation:grow .8s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:50% 100%}
.pop{animation:pop .45s cubic-bezier(.3,1.4,.5,1) both;transform-box:fill-box;transform-origin:center}
.draw{stroke-dasharray:1;animation:draw .9s ease-out both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.smil{display:none}}
